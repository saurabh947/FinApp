# .github/workflows/roverly.yml
#
# Gate every pull request on a Roverly run.
#
# On each PR: build the changed app(s), upload the artifact to Roverly, and turn
# the verdict into a PR check + comment. The run itself executes on your paired
# desktop, so keep the desktop ONLINE with a matching target connected:
#   - Android -> an emulator or device
#   - iOS     -> a booted simulator (we build an unsigned simulator .app)
#
# Dynamic: only the platform whose code changed is built + tested (see `changes`).
#   ios/**                                   -> iOS job
#   app/**, gradle*, build.gradle.kts, etc.  -> Android job
#   a PR touching both                       -> both jobs
#
# Roverly projects are single-platform, so Android and iOS are SEPARATE Roverly
# projects with their own UUIDs. Repo secrets:
#   ROVERLY_API_KEY          CI key with BOTH 'trigger' and 'read' scopes
#   ROVERLY_PROJECT_IOS      iOS project UUID       (set this to enable iOS)
#   ROVERLY_PROJECT_ANDROID  Android project UUID   (set this to enable Android)
# A platform whose project secret is unset skips its gate (green) until you add it.
#
name: Roverly

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes the in-flight runner for this PR (Roverly supersedes the
# queued run itself; this just stops paying for a runner about to be replaced).
concurrency:
  group: roverly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Decide which platform(s) changed ──────────────────────────────
  changes:
    runs-on: ubuntu-latest
    # Fork PRs are not special-cased by the Roverly API (they spend a real run)
    # and a fork token usually can't post the comment back — skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
            ios:
              - 'ios/**'

  # ── Android: build a debug APK, upload + gate on Roverly ──────────
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55            # CLI polls up to 45 min; give it headroom
    permissions:
      contents: read
      pull-requests: write         # to post the verdict comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        run: |
          # gradle.properties pins org.gradle.java.home to a local Mac path;
          # strip it so CI Gradle uses the runner's JDK 21 (set above).
          sed -i.bak '/org\.gradle\.java\.home/d' gradle.properties && rm -f gradle.properties.bak
          # Debug is signed with the auto debug key so it installs on a device;
          # an unsigned release APK would not. Swap to a signed release later.
          ./gradlew --no-daemon assembleDebug

      - name: Roverly (Android)
        env:
          ROVERLY_API_KEY: ${{ secrets.ROVERLY_API_KEY }}
          ROVERLY_PROJECT: ${{ secrets.ROVERLY_PROJECT_ANDROID }}
          # PR text via env, never inlined — a backtick/$(...) in an attacker-
          # controlled PR title would otherwise run on the runner.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$ROVERLY_API_KEY" ] || [ -z "$ROVERLY_PROJECT" ]; then
            echo "Roverly Android not configured (ROVERLY_API_KEY / ROVERLY_PROJECT_ANDROID) — skipping gate."
            exit 0
          fi
          curl -fsSL https://roverly.ai/cli/roverly -o roverly
          chmod +x roverly
          # run_type defaults to feature (goal from --pr-body/--pr-title); needs
          # no pinned production run. branch + commit auto-detected on Actions.
          ./roverly test \
            --project-id "$ROVERLY_PROJECT" \
            --pr-body "$PR_BODY" \
            --pr-title "$PR_TITLE" \
            --pr-url "$PR_URL" \
            --pr-number "$PR_NUMBER" \
            --environment staging \
            --build ./app/build/outputs/apk/debug/app-debug.apk \
            --summary-file roverly-comment.md

      - name: Comment
        if: always() && hashFiles('roverly-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { printf '### Roverly — Android\n\n'; cat roverly-comment.md; } > roverly-pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file roverly-pr-comment.md

  # ── iOS: build an unsigned simulator .app, upload + gate on Roverly ──
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest          # Xcode/simulator SDK is macOS-only
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Build simulator .app
        run: |
          cd ios
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          rm -rf build/FinApp.app && mkdir -p build/FinApp.app
          # Simulator build = no code signing. Matches ios/build.sh.
          xcrun --sdk iphonesimulator swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0-simulator \
            -parse-as-library \
            -o build/FinApp.app/FinApp \
            Sources/*.swift
          cp Info.plist build/FinApp.app/Info.plist
          # Roverly wants a zip containing exactly one .app; ditto is the
          # macOS-correct way to archive an app bundle.
          /usr/bin/ditto -c -k --keepParent build/FinApp.app build/FinApp.app.zip

      - name: Roverly (iOS)
        env:
          ROVERLY_API_KEY: ${{ secrets.ROVERLY_API_KEY }}
          ROVERLY_PROJECT: ${{ secrets.ROVERLY_PROJECT_IOS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$ROVERLY_API_KEY" ] || [ -z "$ROVERLY_PROJECT" ]; then
            echo "Roverly iOS not configured (ROVERLY_API_KEY / ROVERLY_PROJECT_IOS) — skipping gate."
            exit 0
          fi
          curl -fsSL https://roverly.ai/cli/roverly -o roverly
          chmod +x roverly
          ./roverly test \
            --project-id "$ROVERLY_PROJECT" \
            --pr-body "$PR_BODY" \
            --pr-title "$PR_TITLE" \
            --pr-url "$PR_URL" \
            --pr-number "$PR_NUMBER" \
            --environment staging \
            --build ios/build/FinApp.app.zip \
            --summary-file roverly-comment.md

      - name: Comment
        if: always() && hashFiles('roverly-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { printf '### Roverly — iOS\n\n'; cat roverly-comment.md; } > roverly-pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file roverly-pr-comment.md
